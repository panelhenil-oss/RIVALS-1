<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Script Vault — Copy & Go</title>
  <meta name="description" content="Grab your script in one click." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-glow bg-glow--one" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--two" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <div class="page">

    <header class="page-header">
      <div class="brand">
        <span class="brand-mark">&gt;_</span>
        <span class="brand-name">Script Update</span>
      </div>
      <p class="page-subtitle">Here you can find the latest script.</p>
      <button class="copy-btn copy-btn--top" type="button" id="copy-all"><span class="copy-btn__text">Copy</span></button>
    </header>

    <main class="deck">

      <section class="card">
        <div class="card-glow" aria-hidden="true"></div>

        <div class="card-head">
          <span class="card-tag">SLOT 01</span>
          <h2 class="card-title">1 NO KEY SCRIPT</h2>
        </div>

        <div class="code-window">
          <div class="code-window__bar">
            <span class="dot dot--red"></span>
            <span class="dot dot--yellow"></span>
            <span class="dot dot--green"></span>
            <span class="code-window__label">Steal An Egg Script</span>
          </div>
          <pre class="code-body" id="content-1">loadstring(game:HttpGet("https://raw.githubusercontent.com/tienkhanh1/spicy/main/Chilli.lua"))()</pre>
        </div>

      </section>



    </main>

    <footer class="page-footer">
      <p>Works on every device · Copy & Paste</p>
    </footer>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">Kopirano u clipboard</div>

  <script src="script.js"></script>
</body>
</html>
